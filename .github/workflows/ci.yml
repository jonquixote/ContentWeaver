name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Backend - install deps
        working-directory: money_weaver_backend
        run: pip install -r requirements.txt

      - name: Backend - pytest
        working-directory: money_weaver_backend
        run: python -m pytest

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "10.4.1"

      - name: Frontend - install deps
        working-directory: money_weaver_frontend
        run: pnpm install --frozen-lockfile

      - name: Frontend - vitest
        working-directory: money_weaver_frontend
        run: pnpm test

      - name: Frontend - build
        working-directory: money_weaver_frontend
        run: pnpm build