        Tile"},{"name":"tmpf1l7w106.mov","source":"original","mtime":"1709153839","size":"286456120","md5":"4bcd68f6c625752099936e7d328121b6","crc32":"c8fdef09","sha1":"c52752503e2bfe602f798bd9a7ec788bdc69ecff","format":"QuickTime","length":"1736.74","width":"960","height":"540"},{"name":"tmpf1l7w106.mp4","source":"derivative","format":"h.264","original":"tmpf1l7w106.mov","mtime":"1709158427","size":"168897336","md5":"acf449b6ef41cf7fe038360bbad4b384","crc32":"d86bcfb1","sha1":"04cab5649a38857527b3a0b1e7dd50058f1716e8","length":"1736.75","width":"854","height":"480"}],"files_count":36,"item_last_updated":1710439581,"item_size":456394694,"metadata":{"identifier":"Iao5b1Z5uAptyk1WNz76BvyarGgwgV","collection":["PeriscopeFilm","ephemera"],"description":"Men
        With Green Faces (MN 10585) is a Vietnam-era U.S. Navy documentary from 1969
        that explains the intense mental and physical challenges endured by those
        who want to become elite Navy SEALs. In addition to demonstrating the functions
        of the Navy''s frogmen commandos, the film reflects the excitement of parachute
        jump training to the quite of jungle patrols. The film opens with Navy SEALs
        (of what appears to Underwater Demolition Team II) paddling a boat down a
        river; the men leave the river and head into the jungle for a reconnaissance
        mission. New SEALs listen to a commander during training (02:30). The men
        exercise on a field, do pullups, and carry boats while singing. Later, the
        frogmen put on masks and jump out of a raft moving along a body of water at
        a fast pace (05:44). The boat comes back around to retrieve the men, who hook
        their arms on a rope loop to move back into the boat. A member of Underwater
        Demolition Team II explains an Emerson Scuba Rig to the new SEALs (06:58).
        Underwater footage shows the SEALs moving just above the water\u2019s floor
        (07:26), presumably with the Emerson rig. At Fort Benning, GA, the men train
        by jumping out of a Chinook helicopter into water (08:00), repelling down
        a line to simulate a parachute jump (08:32), and experience parachute openings
        while training on a four-armed tower (09:42). The SEALs graduate to parachuting
        out of a plane during an actual training jump (10:44). Several SEALs participate
        in a HALO jump (High Altitude, Low Opening). The SEALs participate in a patrol
        mission during a realistic training (12:20). \u201cEnemy\u201d targets (spring-loaded
        targets) spring up and the SEALs quickly shoot them. Two men practice hand-to-hand
        combat and fighting techniques (14:05). The men repel down a rocky face (14:48),
        moving as quickly as possible. In the classroom, the SEALs learn basic Vietnamese
        (15:50). An aerial view shows viewers Vietnam and what appears to be the Mekong
        River (17:10). At a base in Vietnam, the SEALs\u2019 platoon leader briefs
        his men on an upcoming patrol mission (17:40). They board a PBR in full gear
        and camouflage. The SEALs quietly move through foliage and ford a river. The
        men board a PBR after conducting the patrol. The film then shows the men meeting
        for a debriefing after the mission. Armed Navy patrol boats move on a river
        (23:46), and helicopters take to the air. The frogmen fire the boat\u2019s
        machine guns at unseen targets on the riverbanks (24:49), while the helicopters
        fire at enemy targets on the ground. SEALs attend an awards ceremony where
        they receive various medals (25:55). A commander gives a widow the medals
        earned by her late husband. The United States Navy Sea, Air, and Land Teams,
        commonly abbreviated as Navy SEALs, are the U.S. Navy''s primary special operations
        force and a component of the Naval Special Warfare Command. Among the SEALs''
        main functions are conducting small-unit maritime military operations that
        originate from, and return to, a river, ocean, swamp, delta, or coastline.
        The SEALs are trained to operate in all environments (sea, air, and land)
        for which they are named.\n\nMotion picture films don''t last forever; many
        have already been lost or destroyed. For almost two decades, we''ve worked
        to collect, scan and preserve the world as it was captured on 35mm, 16mm and
        8mm movies -- including home movies, industrial films, and other non-fiction.
        If you have endangered films you''d like to have scanned, or wish to donate
        celluloid to Periscope Film so that we can share them with the world, we''d
        love to hear from you. Contact us via the weblink below.\n\nThis film is part
        of the Periscope Film LLC archive, one of the largest historic military, transportation,
        and aviation stock footage collections in the USA. Entirely film backed, this
        material is available for licensing in 24p HD, 2k and 4k. For more information
        visit http://www.PeriscopeFilm.com","mediatype":"movies","scanner":"Internet
