version: '3.8'

services:
  # Redis for Celery message broker
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

  # MinIO for object storage
  minio:
    image: minio/minio:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin-change-me}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin-change-me}
    command: server /data --console-address ":9001"

  # PostgreSQL database (optional, can use SQLite for development)
  postgres:
    image: postgres:15-alpine
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-money_weaver}
      POSTGRES_USER: ${POSTGRES_USER:-money_weaver}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-money_weaver_password_change_me}
    
  # LiteLLM Proxy
  litellm-proxy:
    image: ghcr.io/berriai/litellm:main-latest
    ports:
      - "8000:8000"
    volumes:
      - ./litellm_config.yaml:/app/config.yaml
    environment:
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY:-sk-master-key-change-me}
    command: ["--config", "/app/config.yaml", "--port", "8000"]
    
  # Flask API server
  api:
    build: .
    ports:
      - "5004:5004"
    volumes:
      - .:/app
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=${DATABASE_URL:-postgresql://money_weaver:money_weaver_password_change_me@postgres:5432/money_weaver}
      - SECRET_KEY=${SECRET_KEY:?}
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-minioadmin-change-me}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:-minioadmin-change-me}
      - LITELLM_PROXY_URL=http://litellm-proxy:8000
    depends_on:
      - redis
      - postgres
      - minio
      - litellm-proxy
    command: python src/main.py

  # Celery worker
  celery_worker:
    build: .
    volumes:
      - .:/app
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=${DATABASE_URL:-postgresql://money_weaver:money_weaver_password_change_me@postgres:5432/money_weaver}
      - SECRET_KEY=${SECRET_KEY:?}
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-minioadmin-change-me}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:-minioadmin-change-me}
      - LITELLM_PROXY_URL=http://litellm-proxy:8000
    depends_on:
      - redis
      - postgres
      - minio
      - litellm-proxy
    command: celery -A src.services.celery_app worker --loglevel=info

  # Celery Flower (monitoring)
  flower:
    build: .
    ports:
      - "5555:5555"
    environment:
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis
    command: celery -A src.services.celery_app flower --port=5555

volumes:
  redis_data:
  minio_data:
  postgres_data:

